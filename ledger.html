<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duck Battle Royale — Battle Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--deck:#0a1016;--panel:#131c25;--panel2:#1a2733;--gold:#f2c14e;--gold-hi:#ffd76b;--teal:#4bb8b0;--cream:#e9eef2;--muted:#7d94a3;--line:#26333f;}
  *{box-sizing:border-box}html,body{margin:0;min-height:100%}
  body{background:linear-gradient(rgba(6,11,16,.5),rgba(6,11,16,.6)), url('arena.jpg') center/cover fixed no-repeat, radial-gradient(1200px 520px at 50% -12%, #14232e 0%, var(--deck) 62%);color:var(--cream);
    font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{width:100%;max-width:900px;margin:0 auto;padding:26px 16px 60px}
  header{text-align:center;margin:34px 0 4px}
  .brand{font-family:'Anton',sans-serif;font-size:clamp(34px,7.2vw,74px);letter-spacing:2px;line-height:.92;text-transform:uppercase;
    -webkit-text-stroke:3px rgba(0,0,0,.85);paint-order:stroke fill;
    background:linear-gradient(180deg,#fff 0%,var(--gold-hi) 55%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 18px rgba(242,193,78,.25))}
  .brand .blade{color:#d64b34;-webkit-text-fill-color:#d64b34}
  .brand b{color:var(--gold-hi)}
  .tag{margin:6px 0 0;font-family:'Anton',sans-serif;font-size:clamp(11px,2vw,15px);letter-spacing:6px;text-transform:uppercase;color:var(--teal);text-align:center;
    -webkit-text-stroke:1.5px rgba(0,0,0,.9);paint-order:stroke fill;
    text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 14px rgba(0,0,0,.7)}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin:14px 0 14px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  .newbtn{display:block;width:max-content;margin:0 auto 26px;font-family:'Anton',sans-serif;letter-spacing:1.5px;text-transform:uppercase;
    background:var(--gold);color:#1a1305;border:0;border-radius:11px;padding:11px 22px;font-size:16px;cursor:pointer;text-decoration:none;
    box-shadow:0 6px 18px rgba(242,193,78,.25);transition:background .15s}
  .newbtn:hover{background:var(--gold-hi)}
  .state{text-align:center;color:var(--muted);padding:50px 10px;font-size:15px}
  .row{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid #2b3a47;border-radius:14px;
    padding:16px 18px;margin-bottom:12px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .row .main{flex:1;min-width:200px}
  .rtitle{font-weight:700;font-size:16px;margin:0 0 4px;word-break:break-word}
  .winner{font-family:'Anton';font-size:20px;color:var(--gold-hi);letter-spacing:.5px;margin:2px 0 8px}
  .podium{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--cream);margin-bottom:8px}
  .podium span{white-space:nowrap}
  .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .hash{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-top:8px;line-height:1.7;cursor:pointer;word-break:break-all}
  .hash b{color:var(--teal)}
  .side{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .replay{font-family:'Anton';letter-spacing:1px;text-transform:uppercase;background:var(--gold);color:#1a1305;
    border:0;border-radius:9px;padding:10px 16px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
  .replay:hover{background:var(--gold-hi)}
  .ducks{font-size:12px;color:var(--muted)}
  .status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.3px;
    border-radius:7px;padding:4px 9px;margin-bottom:8px}
  .status-badge.official{background:rgba(92,196,106,.14);border:1px solid #3a6b40;color:#8fe19a}
  .status-badge.unofficial{background:rgba(214,75,52,.14);border:1px solid #6b3a34;color:#f2a89c}
  .status-badge.committed{background:rgba(75,184,176,.14);border:1px solid #2f5f5b;color:#8fdcd5}
  .status-badge.pending{background:rgba(242,193,78,.12);border:1px solid #5a4a24;color:var(--gold-hi)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gold);color:#1a1305;
    font-weight:600;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;font-size:14px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  footer{margin-top:26px;text-align:center;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#4a5b67}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand">Duck <span class="blade">Battle</span> Royale</div><div class="tag">battle ledger</div></header>
  <p class="sub">Every battle, recorded and replayable.</p>
  <div id="list"><div class="state">Loading battles…</div></div>
  <footer>Duck Battle Royale</footer>
  <a class="newbtn" href="./" style="margin-top:20px">⚔️ New Battle</a>
</div>
<div class="toast" id="toast"></div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);}
function copy(t,m){navigator.clipboard.writeText(t).then(()=>toast(m)).catch(()=>toast('Copy failed'));}
function fmtDate(ts){if(!ts)return'';try{return new Date(ts*1000).toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return'';}}

function statusBadge(r){
  // Legacy rows (written before the commit/reveal system existed) never had a
  // status field, but only ever got written once a real winner was computed —
  // so they're equivalent to "official" and are labeled that way.
  const status = r.status || 'official';
  const map = {
    official:   {cls:'official',   label:'✅ Verified'},
    unofficial: {cls:'unofficial', label:'⚠️ Unofficial — no result posted'},
    committed:  {cls:'committed',  label:'🔒 Committed — awaiting reveal'},
    pending:    {cls:'pending',    label:'⏳ Pending — fight in progress'},
  };
  const m = map[status] || map.official;
  return `<div class="status-badge ${m.cls}">${m.label}</div>`;
}

function render(rows){
  const list=document.getElementById('list');
  if(!Array.isArray(rows)||rows.length===0){
    list.innerHTML='<div class="state">No battles recorded yet. Run one and it\u2019ll show up here.</div>';return;}
  list.innerHTML='';
  for(const r of rows){
    const podium=(r.podium||[]).slice(0,3);
    const medals=['\ud83e\udd47','\ud83e\udd48','\ud83e\udd49'];
    const podHtml=podium.map((nm,i)=>`<span>${medals[i]||''} ${esc(nm)}</span>`).join('');
    const lock=r.lock?esc(String(r.lock).slice(0,16))+'\u2026':'\u2014';
    const seed=(r.seed||r.arena_seed)?esc(String(r.seed||r.arena_seed).slice(0,14))+'\u2026':'\u2014';
    const hasWinner = !!r.winner;
    const div=document.createElement('div');div.className='row';
    div.innerHTML=`
      <div class="main">
        ${statusBadge(r)}
        <div class="rtitle">${esc(r.title||'Duck Battle Royale')}</div>
        ${hasWinner ? `<div class="winner">\ud83d\udc51 ${esc(r.winner)}</div><div class="podium">${podHtml}</div>`
                    : `<div class="winner" style="color:var(--muted);font-size:15px">No result yet</div>`}
        <div class="meta"><span>${fmtDate(r.ts)}</span><span>${r.ducks?esc(r.ducks)+' ducks':''}</span></div>
        ${(r.lock||r.seed||r.arena_seed) ? `<div class="hash" data-lock="${esc(r.lock||'')}" data-seed="${esc(r.seed||r.arena_seed||'')}">\ud83d\udd12 Lock <b>${lock}</b>  \u00b7  \ud83c\udf31 Seed <b>${seed}</b></div>` : ''}
      </div>
      <div class="side">
        ${r.replay?`<a class="replay" href="${esc(r.replay)}" target="_blank" rel="noopener">\u25b6 Replay</a>`:''}
      </div>`;
    const hashEl = div.querySelector('.hash');
    if(hashEl){
      hashEl.addEventListener('click',function(){
        const s=this.getAttribute('data-seed'),l=this.getAttribute('data-lock');
        copy(`seed: ${s}\nlock: ${l}`,'Seed + Lock copied');});
    }
    list.appendChild(div);
  }
}

(async function(){
  try{
    const res=await fetch('./races.json?ts='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('races.json not found ('+res.status+')');
    const data=await res.json();
    // newest first (entries are prepended by the bot, but sort defensively)
    if(Array.isArray(data))data.sort((a,b)=>(b.ts||0)-(a.ts||0));
    render(data);
  }catch(e){
    document.getElementById('list').innerHTML=
      '<div class="state">No ledger yet.</div>';
  }
})();
</script>
</body>
</html>
